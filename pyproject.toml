[project]
name = "diffheat"
version = "0.1.0"
description = "Differentiable heat equation simulations with JAX"
requires-python = ">=3.10"
dependencies = [
    "jax[cuda12]",
    "numpy",
    "harness",
]

[project.optional-dependencies]
viz = ["pyqt6", "matplotlib"]
dev = ["pytest", "jupyter"]

[tool.uv.workspace]
members = ["harness"]

[tool.uv.sources]
harness = { workspace = true }

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["diffheat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    # ROS 2 plugins leak into venvs via PYTHONPATH — suppress them
    "-p no:ament_copyright",
    "-p no:ament_flake8",
    "-p no:ament_lint",
    "-p no:ament_pep257",
    "-p no:ament_xmllint",
    "-p no:launch_ros",
    "-p no:launch_testing",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pyqt6>=6.11.0",
    "pytest>=9.1.1",
    "import-linter>=2.0",
    "scipy>=1.15.3",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
]

[tool.importlinter]
root_packages = ["harness"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "physics stays pure: no env/backend/data/optimizer imports"
type = "forbidden"
source_modules = ["harness.physics"]
forbidden_modules = [
    "harness.envs",
    "harness.backends",
    "harness.materials",
    "harness.profiles",
    "harness.registry",
    "harness.report",
    "gymnasium",
    "optax",
    "cma",
    "optuna",
]

[[tool.importlinter.contracts]]
name = "envs never import backends or report"
type = "forbidden"
source_modules = ["harness.envs"]
forbidden_modules = ["harness.backends", "harness.report"]
