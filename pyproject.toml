[project]
name = "cooling-with-heat"
version = "0.2.0"
description = "Deep learning (PINN surrogates + RL control) for heat-driven adsorption cooling"
requires-python = ">=3.10"
dependencies = [
    "harness",
]

[tool.uv]
# Virtual workspace root: tooling + dependency resolution only; the root
# itself is not a buildable/packageable distribution.
package = false

[tool.uv.workspace]
members = ["harness"]

[tool.uv.sources]
harness = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    # ROS 2 plugins leak into venvs via PYTHONPATH — suppress them
    "-p no:ament_copyright",
    "-p no:ament_flake8",
    "-p no:ament_lint",
    "-p no:ament_pep257",
    "-p no:ament_xmllint",
    "-p no:launch_ros",
    "-p no:launch_testing",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pyqt6>=6.7",
    "pytest>=9.1.1",
    "import-linter>=2.0",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "scipy>=1.15.3",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
]

[tool.importlinter]
root_packages = ["harness"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "physics stays pure: no env/backend/data/optimizer imports"
type = "forbidden"
source_modules = ["harness.physics"]
forbidden_modules = [
    "harness.envs",
    "harness.backends",
    "harness.materials",
    "harness.profiles",
    "harness.registry",
    "harness.report",
    "gymnasium",
    "optax",
    "cma",
    "optuna",
]

[[tool.importlinter.contracts]]
name = "envs never import backends or report"
type = "forbidden"
source_modules = ["harness.envs"]
forbidden_modules = ["harness.backends", "harness.report"]
